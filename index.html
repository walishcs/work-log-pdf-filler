<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作日誌填寫工具</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="form-pane" aria-label="工作日誌欄位">
        <div class="toolbar">
          <div>
            <h1>工作日誌</h1>
            <p>仁愛鄉衛生所原民役</p>
          </div>
          <div class="toolbar-actions">
            <button id="printPdf" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M6 9V3h12v6" />
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                <path d="M6 14h12v7H6z" />
              </svg>
              <span>列印</span>
            </button>
            <button id="downloadPdf" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="M7 10l5 5 5-5" />
                <path d="M12 15V3" />
              </svg>
              <span>下載</span>
            </button>
          </div>
        </div>

        <form id="logForm" autocomplete="on"></form>
      </section>

      <section class="preview-pane" aria-label="PDF 預覽">
        <div class="preview-toolbar">
          <span id="statusText">載入中</span>
        </div>
        <div class="canvas-frame">
          <canvas id="previewCanvas" width="1697" height="2400"></canvas>
        </div>
      </section>
    </main>

    <script src="./assets/pdf-lib.min.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
